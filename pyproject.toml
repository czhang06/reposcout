[project]
name = "reposcout"
version = "0.1.0"
description = "Agentic RAG over the Apache Airflow codebase, docs and issues, with cited answers and a measured eval harness."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "typer>=0.12",
    "snowballstemmer>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
    "langchain-ollama>=0.2",
]
pg = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
reposcout = "reposcout.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
reposcout = ["evals/*.html"]
